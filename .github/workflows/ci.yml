name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Impeccable: no telemetry, no update or taste checks (see .claude/settings.json)
  DO_NOT_TRACK: "1"
  IMPECCABLE_NO_TELEMETRY: "1"
  IMPECCABLE_NO_UPDATE_CHECK: "1"
  IMPECCABLE_NO_STALENESS_CHECK: "1"
  IMPECCABLE_NO_TASTE: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  guards:
    name: Garde-fous (paper, skill intact, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verrou paper (règle 0.1)
        run: python3 scripts/check_paper_lock.py
      - name: Skill intact (règle 0.5)
        run: python3 scripts/skill_integrity.py verify
      - name: Scan de secrets (gitleaks, tout l'historique)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python (skill + scripts + ops)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pytest
        run: python -m pip install --disable-pip-version-check pytest==8.*
      - name: Tests du day-trader-skill (hors test_repo.py)
        run: python scripts/run_skill_tests.py
      - name: Tests Pile
        run: python -m pytest -q scripts/tests $( [ -d ops/tests ] && echo ops/tests )

  node:
    name: TypeScript (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  design:
    name: Impeccable detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Zéro anti-pattern dans app/src
        run: |
          if [ -d app/src ]; then
            npx -y impeccable@4.9.2 detect --github app/src
          else
            echo "app/src n'existe pas encore (jalon 3)."
          fi
