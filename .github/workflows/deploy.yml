name: Deploy

# Deploys only a commit of main whose CI run succeeded (never a pull request).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy half way (migrations).
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  worker:
    name: Veilleur (D1 + Worker)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets Cloudflare présents ?
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID absent : déploiement sauté."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: Verrou paper (encore, juste avant de déployer)
        if: steps.gate.outputs.go == 'true'
        run: python3 scripts/check_paper_lock.py
      - name: Base D1
        if: steps.gate.outputs.go == 'true'
        run: node scripts/ci_d1.mjs
      - name: Migrations D1
        if: steps.gate.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply pile --remote
      - name: Déploiement du Worker
        if: steps.gate.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler deploy
      - name: Sel des jetons (TOKEN_PEPPER), créé une seule fois
        if: steps.gate.outputs.go == 'true'
        working-directory: worker
        run: |
          if npx wrangler secret list --format json | grep -q '"TOKEN_PEPPER"'; then
            echo "TOKEN_PEPPER existe déjà : inchangé."
          else
            # Generated here, piped straight to Cloudflare, never printed.
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put TOKEN_PEPPER >/dev/null
            echo "TOKEN_PEPPER créé."
          fi
      - name: Contrôle après déploiement (lecture seule, rien d'identifiant)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        working-directory: worker
        run: |
          # Two cron events (~2 min) to measure real CPU time. Outside the
          # session the tick returns at once, so this measures the fast path.
          timeout 130 npx wrangler tail pile --format json > "$RUNNER_TEMP/tail.json" 2>/dev/null || true
          node ../scripts/ci_status.mjs d1 | tee -a "$GITHUB_STEP_SUMMARY"
          node ../scripts/ci_status.mjs tail "$RUNNER_TEMP/tail.json" | tee -a "$GITHUB_STEP_SUMMARY"
